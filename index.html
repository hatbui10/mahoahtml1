<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Công Cụ Mã Hóa & Giải Mã Bảo Mật Cao</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
            body { background-color: #09090e; color: #e0e0e8; padding: 20px; min-height: 100vh; }
            .container { max-width: 1000px; margin: 0 auto; background: #11111b; padding: 25px; border-radius: 8px; border: 1px solid #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
            
            /* Tab Navigation */
            .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
            .tab-btn { background: #1a1a2e; color: #888; border: 1px solid #333; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.3s; text-transform: uppercase; font-size: 0.9rem; }
            .tab-btn.active { background: #00f0ff; color: #000; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
            .tab-btn:hover:not(.active) { color: #fff; border-color: #555; }
            
            .tab-content { display: none; }
            .tab-content.active { display: block; }
            
            h2 { text-align: center; margin-bottom: 20px; color: #00f0ff; text-transform: uppercase; letter-spacing: 1px; font-size: 1.4rem; }
            h2.decrypt-title { color: #ff007f; }
            
            .form-group { margin-bottom: 15px; }
            label { display: block; margin-bottom: 8px; font-weight: bold; color: #ffd700; font-size: 0.95rem; }
            textarea { width: 100%; height: 180px; background: #050508; border: 1px solid #333; border-radius: 4px; padding: 12px; color: #fff; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; resize: vertical; outline: none; }
            textarea:focus { border-color: #00f0ff; box-shadow: 0 0 5px rgba(0, 240, 255, 0.3); }
            .decrypt-panel textarea:focus { border-color: #ff007f; box-shadow: 0 0 5px rgba(255, 0, 127, 0.3); }
            
            /* Password Input Style */
            .password-box { background: #1a0813; border: 1px solid #ff007f; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
            .password-box input { width: 100%; background: #050508; border: 1px solid #ff007f; color: #ff007f; padding: 12px; font-size: 1rem; border-radius: 4px; outline: none; letter-spacing: 3px; font-weight: bold; text-align: center; }
            .password-box input::placeholder { letter-spacing: 0px; font-weight: normal; color: #662244; }
            
            .checkbox-group { display: flex; gap: 20px; margin: 15px 0; background: #161625; padding: 10px; border-radius: 4px; border: 1px dashed #444; }
            .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
            .checkbox-label input { width: 16px; height: 16px; cursor: pointer; }
            
            .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
            button.action-btn { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
            
            .btn-encrypt { background: #00f0ff; color: #000; }
            .btn-encrypt:hover { background: #00bcd4; box-shadow: 0 0 10px #00f0ff; }
            .btn-decrypt { background: #ff007f; color: #fff; }
            .btn-decrypt:hover { background: #d8006b; box-shadow: 0 0 10px #ff007f; }
            
            .btn-copy { background: #222; color: #fff; border: 1px solid #444; }
            .btn-copy:hover { background: #333; border-color: #00f0ff; }
            .decrypt-panel .btn-copy:hover { border-color: #ff007f; }
            
            .note { font-size: 0.8rem; color: #888; line-height: 1.4; margin-top: 15px; background: #111; padding: 10px; border-left: 3px solid #ffd700; border-radius: 0 4px 4px 0; }
        </style>
    </head>

    <body>

        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('encryptTab', this)">🔒 1. Mã Hóa Bảo Mật</button>
                <button class="tab-btn" onclick="switchTab('decryptTab', this)">🔓 2. Dịch Ngược Code</button>
            </div>

            <div id="encryptTab" class="tab-content active">
                <h2>🔒 HTML & JS OBFUSCATOR</h2>
                <div class="form-group">
                    <label for="inputCode">Dán toàn bộ code HTML/JS gốc vào đây:</label>
                    <textarea id="inputCode" placeholder="<html>&#10;<head>...</head>&#10;<body>...</body>&#10;</html>"></textarea>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="antiF12" checked> Chống nhấn F12 / Chuột phải xem nguồn trang
                    </label>
                </div>
                <div class="btn-group">
                    <button class="action-btn btn-encrypt" onclick="encryptCode()">⚡ Tiến hành mã hóa</button>
                    <button class="action-btn btn-copy" onclick="copyText('outputCode')">📋 Copy kết quả mã hóa</button>
                </div>
                <div class="form-group">
                    <label for="outputCode">Kết quả mã hóa bảo mật (Dán vào GitHub):</label>
                    <textarea id="outputCode" placeholder="Kết quả mã hóa an toàn sẽ xuất hiện ở đây..." readonly></textarea>
                </div>
            </div>

            <div id="decryptTab" class="tab-content decrypt-panel">
                <h2 class="decrypt-title">🔓 HTML & JS DEOBFUSCATOR</h2>

                <div class="password-box">
                    <label for="decryptPassword" style="color: #ff007f;">🔑 Nhập mật khẩu xác thực quyền cấp cao:</label>
                    <input type="password" id="decryptPassword" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="inputEncrypted">Dán đoạn mã đã bị mã hóa (Lấy từ GitHub) vào đây):</label>
                    <textarea id="inputEncrypted" placeholder="Dán đoạn code bắt đầu bằng eval(&quot;\x...&quot;) hoặc toàn bộ file HTML mã hóa vào đây..."></textarea>
                </div>
                <div class="btn-group">
                    <button class="action-btn btn-decrypt" onclick="decryptCode()">🌀 Tiến hành dịch ngược</button>
                    <button class="action-btn btn-copy" onclick="copyText('outputDecrypted')">📋 Copy code gốc</button>
                </div>
                <div class="form-group">
                    <label for="outputDecrypted">Kết quả khôi phục lại code gốc (Để chỉnh sửa):</label>
                    <textarea id="outputDecrypted" placeholder="Mã nguồn ban đầu sẽ được phục hồi nguyên vẹn tại đây..." readonly></textarea>
                </div>
            </div>

            <div class="note">
                <strong>💡 Nguyên lý bảo mật:</strong> Hệ thống đã tích hợp bộ mã hóa phân rã Unicode nhằm chống lỗi hiển thị tiếng Việt. Chức năng giải mã yêu cầu xác thực khóa bảo mật từ quản trị viên nhằm ngăn chặn hành vi rò rỉ cơ sở dữ liệu danh sách lớp.
            </div>
        </div>

        <script>
            // Cấu hình mật khẩu giải mã tại đây (Bạn có thể sửa '123456' thành mật khẩu bạn muốn)
            const SECRET_PASSWORD = "123456";
            
            // Hàm chuyển đổi qua lại giữa 2 Tab giao diện
            function switchTab(tabId, btn) {
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                btn.classList.add('active');
            }
            
            // --- CHỨC NĂNG 1: MÃ HÓA CODE ---
            function encryptCode() {
                const input = document.getElementById('inputCode').value.trim();
                if (!input) { alert('Vui lòng nhập mã nguồn trước!'); return; }
            
                let bodyContent = "";
                let headContent = "";
            
                if (input.includes("<body") || input.includes("<BODY")) {
                    const bodyMatch = input.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                    bodyContent = bodyMatch ? bodyMatch[1] : input;
                    const headMatch = input.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
                    headContent = headMatch ? headMatch[1] : "";
                } else {
                    bodyContent = input;
                }
            
                let antiCode = "";
                if (document.getElementById('antiF12').checked) {
                    antiCode = "document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&(e.keyCode===73||e.keyCode===74))||(e.ctrlKey&&e.keyCode===85)){e.preventDefault();return false;}});";
                }
            
                const combinedScript = `document.addEventListener('DOMContentLoaded',function(){var c=document.createElement('div');c.innerHTML=${JSON.stringify(bodyContent)};document.body.appendChild(c);var s=c.getElementsByTagName('script');for(var i=0;i<s.length;i++){var n=document.createElement('script');if(s[i].src){n.src=s[i].src;}else{n.text=s[i].text;}document.body.appendChild(n);}${antiCode}});`;
            
                const encodedArray = [];
                for (let i = 0; i < combinedScript.length; i++) {
                    const code = combinedScript.charCodeAt(i);
                    if (code > 127) {
                        encodedArray.push('\\u' + code.toString(16).padStart(4, '0'));
                    } else {
                        encodedArray.push('\\x' + code.toString(16).padStart(2, '0'));
                    }
                }
            
                const obfuscatedString = encodedArray.join('');
                const finalHTML = `<!DOCTYPE html>\n<html lang="vi">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${headContent ? headContent.replace(/<script[\s\S]*?<\/script>/gi, '').trim() : '<title>Bảo Mật Hệ Thống</title>'}\n</head>\n<body>\n<div id="app"></div>\n<script>\neval("${obfuscatedString}");\n<\/script>\n</body>\n</html>`;
            
                document.getElementById('outputCode').value = finalHTML;
            }
            
            // --- CHỨC NĂNG 2: DỊCH NGƯỢC CODE (CÓ CHECK MẬT KHẨU) ---
            function decryptCode() {
                const passwordInput = document.getElementById('decryptPassword').value;
                const input = document.getElementById('inputEncrypted').value.trim();
            
                // 1. Kiểm tra mật khẩu đầu vào trước tiên
                if (!passwordInput) {
                    alert('Vui lòng nhập mật khẩu xác thực để kích hoạt tính năng giải mã!');
                    return;
                }
                if (passwordInput !== SECRET_PASSWORD) {
                    alert('Mật khẩu sai! Bạn không có quyền dịch ngược đoạn mã này.');
                    return;
                }
            
                // 2. Kiểm tra dữ liệu đầu vào
                if (!input) { alert('Vui lòng dán đoạn mã cần dịch ngược!'); return; }
            
                try {
                    let rawHexStr = "";
                    if (input.includes('eval("')) {
                        rawHexStr = input.split('eval("')[1].split('");')[0];
                    } else if (input.includes("eval('")) {
                        rawHexStr = input.split("eval('")[1].split("');")[0];
                    } else {
                        rawHexStr = input;
                    }
            
                    const decryptedScript = new Function(`return "${rawHexStr}";`)();
            
                    let htmlContent = "";
                    if (decryptedScript.includes('c.innerHTML=')) {
                        let segment = decryptedScript.split('c.innerHTML=')[1];
                        let match = segment.match(/^"([\s\S]*?)"(?=;document)/) || segment.match(/^'([\s\S]*?)'(?=;document)/);
                        if (match) {
                            htmlContent = JSON.parse('"' + match[1] + '"');
                        } else {
                            htmlContent = decryptedScript;
                        }
                    } else if (decryptedScript.includes('container.innerHTML = ')) {
                        let segment = decryptedScript.split('container.innerHTML = ')[1];
                        let match = segment.match(/^"([\s\S]*?)"(?=;document)/) || segment.match(/^'([\s\S]*?)'(?=;document)/);
                        if (match) {
                            htmlContent = JSON.parse('"' + match[1] + '"');
                        } else {
                            htmlContent = decryptedScript;
                        }
                    } else {
                        htmlContent = decryptedScript;
                    }
            
                    document.getElementById('outputDecrypted').value = htmlContent;
                } catch (err) {
                    alert('Lỗi: Cấu trúc code giải mã không đúng định dạng eval("\\x...") chuẩn hoặc dữ liệu bị thiếu hụt.');
                    console.error(err);
                }
            }
            
            function copyText(areaId) {
                const output = document.getElementById(areaId);
                if (!output.value) { alert('Không có dữ liệu để copy!'); return; }
                output.select();
                document.execCommand('copy');
                alert('🚀 Đã copy thành công vào bộ nhớ tạm!');
            }
        </script>

    </body>

</html>
